<h2 mat-dialog-title>Unsaved changes</h2>

<mat-dialog-content>
  <p>You have unsaved changes.</p>

  <p>What would you like to do?</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close('cancel')">Cancel</button>

  <button mat-button color="warn" (click)="close('discard')">Discard</button>

  <button mat-flat-button color="primary" (click)="close('save')">Save</button>
</mat-dialog-actions>
