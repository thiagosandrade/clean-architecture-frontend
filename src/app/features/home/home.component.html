<div class="home">


    <div class="hero">


        <h1>{{ greeting }} 👋</h1>

        <p>
            What would you like to accomplish today?
        </p>


        <mat-card class="assistant-card">


            <mat-form-field appearance="outline">

                <mat-label>
                    Ask something...
                </mat-label>


                <input matInput [(ngModel)]="question" (keyup.enter)="ask()" />


            </mat-form-field>



            <button mat-flat-button color="primary" class="ask-button" (click)="ask()">


                <mat-icon>
                    send
                </mat-icon>


                Ask


            </button>


        </mat-card>



        <div class="suggestions">


            <button mat-stroked-button *ngFor="let item of suggestions" (click)="select(item)">


                {{item}}


            </button>


        </div>

        @if(loading)
        {
        <mat-spinner></mat-spinner>
        }
        @else
        {
            @if(assistantMessage)
            {
            <mat-card class="assistant-card">

                <mat-icon>
                    smart_toy
                </mat-icon>

                <span>
                    {{ assistantMessage }}
                </span>

            </mat-card>
            }

            @if(tasks.length)
            {
            <div class="results">

                <h2>
                    Assistant Results
                </h2>

                <app-overview [tasks]="tasks">
                </app-overview>

                <app-task-summary [tasks]="tasks" (view)="openTodo($event)">
                </app-task-summary>

            </div>
            }
            @else if(question && !loading && hasSearched)
            {
            <mat-card class="empty-results">

                <mat-icon>
                    search_off
                </mat-icon>

                <span>
                    {{ emptyMessage }}
                </span>

            </mat-card>
            }
        }


    </div>



</div>
