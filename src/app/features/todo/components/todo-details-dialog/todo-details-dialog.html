<h2 mat-dialog-title>
    Todo Details
</h2>

<mat-dialog-content>

    <app-todo-details
        [todoId]="data.id"
        (refreshRequested)="onRefreshRequested()">
    </app-todo-details>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
        mat-button
        (click)="close()">

        Close

    </button>

</mat-dialog-actions>
