<h2 mat-dialog-title>
  {{ data.isEdit ? 'Edit Todo' : 'Create Todo' }}
</h2>

<mat-dialog-content>
  <app-todo-info [todo]="data.todo!" (refreshRequested)="onRefreshRequested()"></app-todo-info>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Close</button>
</mat-dialog-actions>
