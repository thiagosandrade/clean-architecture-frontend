<h2 mat-dialog-title>
  {{ data.mode == 'edit' ? 'Edit Todo' : data.mode == 'create' ? 'Create Todo' : 'View Todo' }}
</h2>

<mat-dialog-content>
  <app-todo-info [mode]="mode"  [taskId]="taskId"></app-todo-info>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Close</button>
</mat-dialog-actions>
