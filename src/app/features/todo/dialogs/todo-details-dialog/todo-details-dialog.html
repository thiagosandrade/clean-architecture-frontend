<h2 mat-dialog-title>Todo Details</h2>

<mat-dialog-content>
  @if (taskId) {
    <app-todo-details [taskId]="taskId"></app-todo-details>
  } @else {
    <p>No task selected.</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Close</button>
</mat-dialog-actions>
